name: Build
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (например: com.mojang.minecraftpe)'
        required: true
        default: 'com.args.Mel'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew :module:assembleRelease -PpackageName=${{ github.event.inputs.package }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Zygisk-Il2CppDumper
          path: module/build/outputs/zip/release/*.zip
