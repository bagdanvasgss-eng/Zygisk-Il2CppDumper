name: Build
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (например: com.memphis.standarling)'
        required: true
        default: 'com.memphis.standarling'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :module:assembleRelease -PpackageName=${{ github.event.inputs.package }}

      # Ищем собранный zip везде, где он может оказаться, и копируем в одну папку
      - name: Find and prepare zip
        run: |
          mkdir -p final_artifact
          find . -name "*.zip" -exec cp {} final_artifact/ \;
          ls -la final_artifact/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zygisk-Il2CppDumper-${{ github.event.inputs.package }}
          path: final_artifact/*.zip
          if-no-files-found: error
